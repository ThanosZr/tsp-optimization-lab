name: TSP baseline CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.12']
    runs-on: ${{ matrix.os }}
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements.txt
      - run: python -m compileall -q algorithms core gui main.py cli.py bootstrap.py
      - run: python -m unittest discover -s tests -v
      - run: python cli.py run --n 12 --seed 7 --algos som custom
      - run: python cli.py benchmark --algo custom --n 30 --seeds 0-5
